<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEYTEK CLAUD</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mobile.css">
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="topbar glass">
  <img class="tlogo" src="img/deytekclaud.png" alt="DeyTek" onerror="this.remove()">
  <span class="ttitle">DEYTEK CLAUD</span>
  <!-- Sin sesión no se ve; con sesión muestra tu foto (abre tu perfil). auth.js lo necesita, no lo borres -->
  <button type="button" class="btn glass acct" id="acct">Entrar</button>
  <!-- Los pide social.js; en escritorio no se usan -->
<button type="button" class="btn glass social-trigger" id="social-btn" hidden>Amigos <span class="badge" id="sbadge" hidden>0</span></button>
  <!-- Botones de ventana propios (la barra de Windows está desactivada en main.js) -->
  <div class="wc" id="wc">
    <button type="button" class="wbtn" id="w-min" aria-label="Minimizar" title="Minimizar">
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
    </button>
    <button type="button" class="wbtn" id="w-max" aria-label="Maximizar" title="Maximizar">
      <svg class="i-sq" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      <svg class="i-rs" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="3.5" width="6.5" height="6.5" rx="1.3" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M4 3.5V2.8A.8.8 0 0 1 4.8 2h4.4a.8.8 0 0 1 .8.8v4.4a.8.8 0 0 1-.8.8H8.5" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
    </button>
    <button type="button" class="wbtn close" id="w-close" aria-label="Cerrar" title="Cerrar">
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div></header>

<main id="welcome" class="welcome-screen">
  <img src="img/deytekclaud.png" alt="" onerror="this.remove()">
  <h1>DEYTEK CLAUD</h1>
  <p>Inicia sesión para ver tus amigos, chatear y llamar.</p>
  <button type="button" class="btn solid" id="welcome-btn">Iniciar sesión</button>
</main>

<dialog id="social-dlg" aria-label="Amigos y Chat">
  <button type="button" class="x" id="sclose" aria-label="Cerrar">×</button>
  <div class="social-wrap">
    <aside class="social-side">
      <h3>Amigos</h3>
      <form id="fsearch" class="fsearch">
        <input id="fquery" type="text" placeholder="ID de amigo (ej. DTK-12345)…" required>
        <button type="submit" class="btn solid sm" aria-label="Agregar">+</button>
      </form>
      <p id="fstatus" role="status"></p>

      <div id="freq-box" hidden>
        <small class="sec-lbl">Solicitudes</small>
        <div id="freq-list" class="flist"></div>
      </div>

      <small class="sec-lbl">Tus amigos</small>
      <div id="ffriend-list" class="flist"></div>
    </aside>

    <div class="social-chat">
      <header id="chat-head" class="chat-head">
        <span>Selecciona un amigo para chatear</span>
      </header>
      <div id="chat-body" class="chat-body">
        <div class="welcome cnone">
          <p>Tus mensajes y fotos son privados entre tú y tus amigos.</p>
          <img src="img/deyteknoti.png" alt="Bienvenida">
        </div>
      </div>
      <div id="chat-prev" class="chat-prev" hidden></div>
      <form id="chat-form" class="chat-form" hidden>
        <label class="btn glass sm photo-lbl" title="Enviar foto">
          <img src="img/gallery.png" alt="Subir foto">
          <input type="file" id="chat-photo" accept="image/*" hidden>
        </label>
        <input id="chat-in" type="text" placeholder="Escribe un mensaje…" maxlength="1000" autocomplete="off">
        <button type="submit" class="btn solid sm">Enviar</button>
      </form>
    </div>
  </div>
</dialog>

<!-- LOGIN: cambia aquí los textos y se quedan. Los que tienen data-signup cambian al "Crear cuenta". -->
<dialog id="auth" aria-labelledby="at">
  <img class="alogo" src="img/deytekclaud.png" alt="DeyTek Claud" width="512" height="512" onerror="this.remove()">
  <h3 id="at" data-signup="Crea tu cuenta">Entra a DEYTEK CLAUD</h3>
  <!-- Google no permite iniciar sesión dentro de apps Electron: se oculta en escritorio -->
  <button type="button" class="btn solid" id="google" hidden>Continuar con Google</button>
  <form id="authform">
    <input id="aname" name="name" placeholder="Nombre" autocomplete="name" maxlength="40" hidden>
    <input id="aemail" name="email" type="email" placeholder="Correo" autocomplete="email" required>
    <input id="apass" name="pass" type="password" placeholder="Contraseña (mín. 6)" minlength="6" autocomplete="current-password" required>
    <button type="submit" class="btn solid" id="asubmit" data-signup="Crear cuenta">Iniciar sesión</button>
  </form>
  <p class="sw"><span id="stxt" data-signup="¿Ya tienes cuenta?">¿No tienes cuenta?</span> <button type="button" class="link" id="swap" data-signup="Iniciar sesión">Crear cuenta</button></p>
  <button type="button" class="link" id="reset">Olvidé mi contraseña</button>
  <p id="astatus" role="status"></p>
  <button type="button" class="btn glass" id="aclose">Cerrar</button>
</dialog>

<dialog id="profile" aria-labelledby="pt">
  <h3 id="pt">Tu perfil</h3>
  <label class="pic"><img id="pimg" alt="Foto de perfil"><input type="file" id="pfile" accept="image/png, image/jpeg, image/gif"><span>Cambiar foto</span></label>
  <input id="pname" placeholder="Nombre" maxlength="40" aria-label="Nombre">
  <div class="id-box" title="Comparte este ID para que te agreguen como amigo">
    <span>Tu ID: <b id="pfriend-id">---</b></span>
    <button type="button" class="btn glass sm" id="pcopy-id">Copiar</button>
  </div>
  <p id="pmail"></p>
  <button type="button" class="btn solid" id="psave">Guardar cambios</button>
  <button type="button" class="btn glass" id="pout">Cerrar sesión</button>
  <button type="button" class="link" id="pclose">Cerrar</button>
  <p id="pstatus" role="status"></p>
</dialog>

<dialog id="lightbox" aria-label="Foto"><img id="lbimg" alt="Foto ampliada"></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="social.js"></script>
<script src="call.js"></script>
<script src="desktop.js"></script>
</body>
</html>
